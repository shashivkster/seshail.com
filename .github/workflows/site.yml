name: Build and deploy seshail.com

# Runs on three triggers:
#   push          — you edit the site, it redeploys
#   schedule      — 01:30 UTC (07:00 IST) daily news refresh
#   workflow_dispatch — the "Run workflow" button in the Actions tab
on:
  push:
    branches: [main]
  schedule:
    - cron: '30 1 * * *'
  workflow_dispatch:

permissions:
  contents: write      # to commit the refreshed news.json
  pages: write         # to publish
  id-token: write      # required by the deploy action

# Never let two deploys run at once
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Crawl on the schedule and on manual runs. Skipped for ordinary pushes,
      # so editing the site does not wait on eight network calls.
      - name: Crawl technology news
        if: github.event_name != 'push'
        run: python3 scripts/fetch_news.py
        continue-on-error: true

      # Keep the refreshed file in the repository so it survives the next push.
      - name: Commit news.json if it changed
        if: github.event_name != 'push'
        continue-on-error: true
        run: |
          git config user.name  "news-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain news.json)" ]; then
            git add news.json
            git commit -m "Daily technology news refresh"
            git push
            echo "news.json updated and committed."
          else
            echo "No change to news.json today."
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
