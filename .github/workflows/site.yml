name: Build and deploy seshail.com

# Runs on three triggers, and crawls the news on all of them:
#   push              — you edit the site
#   schedule          — 01:30 UTC (07:00 IST) daily
#   workflow_dispatch — the "Run workflow" button in the Actions tab
on:
  push:
    branches: [main]
  schedule:
    - cron: '30 1 * * *'
  workflow_dispatch:

permissions:
  contents: write      # to commit the refreshed news.json
  pages: write         # to publish
  id-token: write      # required by the deploy action

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Runs on every trigger. If it fails the step goes red, but the
      # site still publishes — see the || true at the end.
      - name: Crawl technology news
        run: |
          echo "=============================================="
          echo "Crawling feeds"
          echo "=============================================="
          python3 scripts/fetch_news.py || echo "CRAWL FAILED — see errors above"
          echo "=============================================="
          echo "Result:"
          python3 - <<'EOF'
          import json
          try:
              d = json.load(open('news.json'))
              print(f"  news.json now holds {d.get('count', 0)} stories")
              print(f"  generated_at: {d.get('generated_at')}")
              for i in d.get('items', [])[:5]:
                  print(f"    - [{i['source']}] {i['title'][:70]}")
              if d.get('count', 0) == 0:
                  print("  WARNING: no stories were kept. Every feed either failed")
                  print("  or returned nothing matching the keyword filter.")
          except Exception as e:
              print(f"  Could not read news.json: {e}")
          EOF
          echo "=============================================="

      - name: Commit news.json if it changed
        continue-on-error: true
        run: |
          git config user.name  "news-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain news.json)" ]; then
            git add news.json
            git commit -m "Technology news refresh [skip ci]"
            git push
            echo "news.json committed."
          else
            echo "news.json unchanged."
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
