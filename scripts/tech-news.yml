name: Daily technology news crawl

on:
  schedule:
    # 01:30 UTC every day = 07:00 IST
    - cron: '30 1 * * *'
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Crawl feeds
        run: python3 scripts/fetch_news.py

      - name: Commit if changed
        run: |
          git config user.name  "news-bot"
          git config user.email "actions@github.com"
          if [[ -n "$(git status --porcelain news.json)" ]]; then
            git add news.json
            git commit -m "Daily technology news refresh"
            git push
          else
            echo "No change today."
          fi
